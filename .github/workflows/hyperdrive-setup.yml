name: Hyperdrive setup

on:
  push:
    branches: [main, claude/great-franklin-kisti3]
    paths: ['.github/workflows/hyperdrive-setup.yml']

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Diagnose grupo01 credentials (no secret printed)
        env:
          DB_URL_01: ${{ secrets.AREA04_DB_URL }}
        run: |
          url=$(printf %s "$DB_URL_01" | tr -d '[:space:]')
          node -e '
            const u = new URL(process.argv[1]);
            const pw = decodeURIComponent(u.password);
            const h = require("crypto").createHash("sha256").update(pw).digest("hex");
            console.log("usuario:", decodeURIComponent(u.username));
            console.log("host:", u.hostname, "porta:", u.port);
            console.log("tamanho da senha:", pw.length);
            console.log("senha confere com a esperada:", h === "fa74973a17c515ebf968f6735071738988f082ce28547372a8508c41bf6d8dea" ? "SIM" : "NAO");
          ' "$url"
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1 || true
          session="${url/:6543\//:5432/}"
          psql "$session?sslmode=require&connect_timeout=10" -c "select current_user" 2>&1 | sed -E 's#://[^@]*@#://***@#' || true
      - name: Create Hyperdrive configs (idempotent)
        env:
          DB_URL_01: ${{ secrets.AREA04_DB_URL }}
          DB_URL_02: ${{ secrets.AREA04_ADMIN_DB_URL }}
        run: |
          set -uo pipefail
          # Hyperdrive faz o próprio pool, então aponta para o pooler em
          # session mode (5432), não transaction mode (6543). Tenta os dois
          # clusters do pooler da Supabase na região: a criação valida a
          # conexão, então só o host certo passa.
          criar() {
            nome="$1"; url=$(printf %s "$2" | tr -d '[:space:]')
            senha=$(node -e 'console.log(decodeURIComponent(new URL(process.argv[1]).password))' "$url")
            echo "::add-mask::$senha"
            if npx wrangler hyperdrive list 2>/dev/null | grep -q "$nome"; then
              echo "$nome já existe"
              return 0
            fi
            base="${url/:6543\//:5432/}"
            for cluster in aws-0 aws-1; do
              tentativa=$(echo "$base" | sed -E "s/aws-[01]-/${cluster}-/")
              echo "Tentando $nome em $cluster (session mode)..."
              if npx wrangler hyperdrive create "$nome" --connection-string="$tentativa"; then
                echo "$nome criado usando $cluster"
                return 0
              fi
            done
            echo "Falha ao criar $nome"
            return 1
          }
          status=0
          criar area04-grupo01 "$DB_URL_01" || status=1
          criar area04-grupo02 "$DB_URL_02" || status=1
          npx wrangler hyperdrive list || true
          exit $status
