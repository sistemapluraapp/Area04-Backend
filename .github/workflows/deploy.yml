name: Deploy Worker

on:
  push:
    branches: [main, claude/great-franklin-kisti3]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - name: Set Worker secrets
        run: |
          echo "${{ secrets.ADMIN_SIGNUP_CODE }}" | npx wrangler secret put ADMIN_SIGNUP_CODE
          echo "${{ secrets.RESEND_API_KEY }}" | npx wrangler secret put RESEND_API_KEY
          # Hook de e-mail do Supabase: só grava se o secret existir no GitHub.
          if [ -n "${{ secrets.SEND_EMAIL_HOOK_SECRET }}" ]; then
            echo "${{ secrets.SEND_EMAIL_HOOK_SECRET }}" | npx wrangler secret put SEND_EMAIL_HOOK_SECRET
          fi
          # Consumo de infraestrutura: só grava se o secret existir no GitHub.
          if [ -n "${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}" ]; then
            echo "${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}" | npx wrangler secret put CLOUDFLARE_ANALYTICS_TOKEN
            echo "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" | npx wrangler secret put CLOUDFLARE_ACCOUNT_ID
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
