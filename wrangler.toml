# Secrets de verdade (nunca commitados): configurados automaticamente pelo
# workflow de deploy (.github/workflows/deploy.yml) a partir de secrets do
# repositório no GitHub — não precisa rodar `wrangler secret put` manualmente.
#   AREA04_DB_URL       — conexão Postgres com o papel restrito
#                         `area04_backend` no grupo.01 (leitura ampla +
#                         escrita em certificados.status/avaliado_em e
#                         avaliacoes.notificada_em)
#   AREA04_ADMIN_DB_URL — conexão Postgres com o papel restrito
#                         `area04_notifier` no próprio grupo.02, usada só
#                         pelo Cron Trigger (sem JWT de admin) para
#                         executar a função broadcast_notificacao_admin
#   ADMIN_SIGNUP_CODE   — código exigido para criar uma conta de admin
#   RESEND_API_KEY      — chave da API do Resend para envio de e-mails
